name: Build NeuroSpec

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NeuroSpec.csproj

      - name: Publish single-file portable exe
        run: dotnet publish NeuroSpec.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroSpec-exe
          path: dist/NeuroSpec.exe

      - name: Create GitHub Release with exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NeuroSpec build ${{ github.run_number }}
          files: dist/NeuroSpec.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
